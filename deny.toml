# First Proof Cargo Deny Configuration
# Story 4.1: Open Source IP, Security & License Compliance Gate

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
    # basic-toml 0.1.10 is unmaintained; transitively pulled in by askama_parser/askama_derive inside uniffi_bindgen 0.32
    "RUSTSEC-2026-0374",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "CC0-1.0",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.8

# Explicit, audited carve-outs for third-party libraries
exceptions = [
    { allow = ["LGPL-2.1"], crate = "rawler" }
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
