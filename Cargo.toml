[workspace]
members = [
    "firstproof-core",
    "firstproof-wasm",
    "firstproof-engine",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
authors = ["First Proof Contributors"]
repository = "https://github.com/blikkie/firstproof"


[workspace.lints.clippy]
too_many_arguments = "allow"
needless_range_loop = "allow"
approx_constant = "allow"
erasing_op = "allow"
identity_op = "allow"
manual_checked_ops = "allow"
field_reassign_with_default = "allow"
bool_assert_comparison = "allow"
manual_range_contains = "allow"
type_complexity = "allow"

# Targeted optimizations for heavy mathematical & demosaicing routines in debug/test builds
[profile.dev.package.firstproof-core]
opt-level = 2

[profile.dev.package.firstproof-engine]
opt-level = 2

[profile.dev.package.rawler]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.jxl-oxide]
opt-level = 3

[profile.dev.package.bayer]
opt-level = 3

