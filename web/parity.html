<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>First Proof — Automated Mechanical Parity Test Runner</title>
  <style>
    body {
      background-color: #0f1117;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      padding: 2rem;
      margin: 0;
    }
    h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
    .subtitle { color: #94a3b8; font-size: 0.85rem; margin-bottom: 1.5rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.85rem; }
    th, td { padding: 0.6rem 0.8rem; border-bottom: 1px solid #1e293b; text-align: left; }
    th { color: #94a3b8; background-color: #1e293b; }
    .badge { padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: bold; font-size: 0.75rem; }
    .badge.pass { background-color: #14532d; color: #4ade80; }
    .badge.fail { background-color: #7f1d1d; color: #f87171; }
    .fail-txt { color: #f87171; font-weight: bold; }
    #summary-banner {
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      font-size: 1rem;
      font-weight: 600;
    }
    #summary-banner.pass { background-color: rgba(34, 197, 94, 0.15); border: 1px solid #22c55e; color: #4ade80; }
    #summary-banner.fail { background-color: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #f87171; }
    .diagnosis { font-size: 0.8rem; color: #cbd5e1; }
  </style>
</head>
<body>
  <h1>First Proof — Mechanical Parity Test Runner</h1>
  <div class="subtitle">Dual-Engine Bit-Level Verification: WebGL GPU Preview vs. Reference CPU Export</div>

  <div id="summary-banner">Running automated parity test battery...</div>

  <table>
    <thead>
      <tr>
        <th>Status</th>
        <th>Test Scenario</th>
        <th>Max Channel Δ</th>
        <th>Mean Channel Δ</th>
        <th>PSNR</th>
        <th>Stage Diagnosis</th>
      </tr>
    </thead>
    <tbody id="test-rows"></tbody>
  </table>

  <script type="module">
    import { ParityHarness } from '/src/parity/ParityHarness';

    async function run() {
      const harness = new ParityHarness(256, 256);
      const results = harness.runFullAudit();
      window.parityResults = results;

      const tbody = document.getElementById('test-rows');
      tbody.innerHTML = '';

      let allPass = true;
      for (const res of results) {
        if (!res.pass) allPass = false;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><span class="badge ${res.pass ? 'pass' : 'fail'}">${res.pass ? 'PASS' : 'FAIL'}</span></td>
          <td><strong>${res.testName}</strong></td>
          <td class="${res.maxChannelDelta > 2 ? 'fail-txt' : ''}">${res.maxChannelDelta}/255</td>
          <td>${res.meanChannelDelta.toFixed(2)}</td>
          <td>${res.psnr.toFixed(1)} dB</td>
          <td class="diagnosis">${res.stageDiagnosis}</td>
        `;
        tbody.appendChild(tr);
      }

      const banner = document.getElementById('summary-banner');
      if (allPass) {
        banner.className = 'pass';
        banner.innerText = `✓ 100% BIT-LEVEL PARITY PASS: All ${results.length} test scenarios match within tolerance!`;
      } else {
        banner.className = 'fail';
        banner.innerText = `⚠ PARITY DIVERGENCE DETECTED: Review failing test scenarios and stage diagnoses below.`;
      }

      console.log('[PARITY TEST COMPLETE]', JSON.stringify(results.map(r => ({
        id: r.testId,
        pass: r.pass,
        maxDelta: r.maxChannelDelta,
        meanDelta: r.meanChannelDelta,
        psnr: r.psnr,
        diagnosis: r.stageDiagnosis
      }))));

      try {
        await fetch('/api/log-parity', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(results.map(r => ({
            id: r.testId,
            name: r.testName,
            pass: r.pass,
            maxDelta: r.maxChannelDelta,
            meanDelta: r.meanChannelDelta,
            psnr: r.psnr,
            diagnosis: r.stageDiagnosis
          })))
        });
      } catch (e) {
        console.warn('Could not post parity report to /api/log-parity:', e);
      }
    }

    run();
  </script>
</body>
</html>
